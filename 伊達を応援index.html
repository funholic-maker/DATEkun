 // 当たった障害物は必ず消す。無敵時間切れ後に同じ杯が再ヒットする不具合を防止。
 obstacles.splice(i,1);
 if(o.type==='yamada'){lose(o);break}
 if(o.type==='solmac'){
   if(hits>0){hits--;hitsEl.textContent=hits+' / 5杯';hitFlash=.08;recoverySound()}
 }else{
   hits++;hitsEl.textContent=hits+' / 5杯';hitFlash=.2;drinkHitSound();showCheer();
   if(hits>=5){lose(o);break}
 }
}else if(o.y>H+o.size)obstacles.splice(i,1)}}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e8e2f5');g.addColorStop(1,'#f4eff9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d8cdec';for(let i=0;i<9;i++){let x=(i*79+37)%W,y=(i*123+76)%H;ctx.beginPath();ctx.arc(x,y,Math.max(3,i*2),0,7);ctx.fill()}ctx.fillStyle='#c3bbd8';ctx.fillRect(0,H-76,W,76);ctx.strokeStyle='#877fae';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H-76);ctx.lineTo(W,H-76);ctx.stroke();for(const o of obstacles){if(o.type==='yamada'&&art.yamada.complete&&art.yamada.naturalWidth){ctx.drawImage(art.yamada,o.x-o.size*.49,o.y-o.size*.62,o.size*.98,o.size*1.30)}else drawDrink(o)}ctx.fillStyle='#9690af';ctx.beginPath();ctx.ellipse(player.x,H-77,player.w*.40,7,0,0,7);ctx.fill();if(art.date.complete&&art.date.naturalWidth){ctx.save();ctx.filter='saturate(1.75) contrast(1.33) brightness(0.87)';ctx.shadowColor='rgba(14,63,124,.48)';ctx.shadowBlur=7;ctx.drawImage(art.date,player.x-player.w/2,player.y,player.w,player.h);ctx.filter='none';ctx.restore();}else{ctx.textAlign='center';ctx.font='70px serif';ctx.fillText('🧢',player.x,player.y+80)}if(run&&hitFlash>0){ctx.fillStyle='rgba(248,54,63,'+(hitFlash/.2*.22)+')';ctx.fillRect(0,0,W,H)}}
function loop(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.045);last=now;update(dt);music();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function point(e){const r=c.getBoundingClientRect();pointerX=clamp(e.clientX-r.left,0,W)}c.addEventListener('pointerdown',e=>{if(run){c.setPointerCapture(e.pointerId);point(e)}});c.addEventListener('pointermove',e=>{if(run&&(e.pointerType==='touch'||e.buttons))point(e)});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '&&!run)startGame()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
</script></body></html>
