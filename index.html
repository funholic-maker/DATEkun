<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf7ff"><title>伊達を応援する｜無事に帰ろう</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}body{background:#0a274f;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#093873;display:flex;align-items:center;justify-content:center}.shell{position:relative;width:min(100vw,480px);height:100dvh;overflow:hidden;background:#e8e2f5;box-shadow:0 0 50px #0008}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;gap:9px;padding:12px 12px;pointer-events:none}.stat{background:#fff;border:3px solid #1b64a6;border-radius:15px;min-width:95px;padding:5px 10px;text-align:center;box-shadow:3px 4px 0 #94c9e5}.stat small{font-size:10px;font-weight:900;display:block}.stat b{font-size:21px;font-variant-numeric:tabular-nums}.cover{position:absolute;inset:0;background:linear-gradient(#d8f5fffa,#fefefefb);z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}.cover h1{font-size:clamp(24px,7vw,37px);white-space:nowrap;letter-spacing:-.055em;line-height:1.13;margin:0 0 8px;color:#ffe12f;-webkit-text-stroke:2px #0b4b93;text-shadow:3px 4px 0 #0b4b93;font-weight:1000}.sub{font-size:23px;font-weight:1000;color:#e63b43}.hero{height:min(45vh,360px);max-width:88%;object-fit:contain;mix-blend-mode:normal;margin:24px 0 28px}.rule{font-size:13px;font-weight:850;line-height:1.8;background:#fff;border:3px solid #1b64a6;border-radius:14px;padding:10px 15px;margin:10px 0 17px}.primary{border:3px solid #0d467e;border-radius:99px;background:#f54b4b;color:white;font-size:22px;font-weight:1000;padding:14px 28px;box-shadow:0 6px 0 #0d467e;cursor:pointer;min-width:220px}.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #0d467e}.tiny{margin:15px 0 0;font-size:12px;font-weight:750}.hide{display:none!important}.sound{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:3;background:white;border:2px solid #2067a2;border-radius:40px;padding:8px 12px;font-weight:900;color:#174c85}.over{position:absolute;inset:0;z-index:7;background:#e4f5ff;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden}.over h2{font-weight:1000;font-size:clamp(30px,9vw,48px);color:#ffe138;-webkit-text-stroke:2px #07519d;text-shadow:3px 4px #07519d;margin:15px 0 0;z-index:2}.over .reason{color:#c52136;font-size:21px;font-weight:1000;margin:5px 0;z-index:2}.wheel{height:65vh;max-width:105%;object-fit:contain;mix-blend-mode:multiply;z-index:1}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:3;background:#ffffffef;border-radius:18px;border:3px solid #07519d;padding:12px 17px}.result{font-size:22px;font-weight:1000;margin:0 0 12px}.bottom .primary{font-size:18px;padding:10px 20px}.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);width:100%;pointer-events:none;text-align:center;color:#356896;font-weight:800;font-size:12px}@media(max-height:680px){.cover{padding:8px}.cover h1{font-size:clamp(22px,6.6vw,32px)}.hero{height:36vh;margin:12px 0 16px}.rule{font-size:11px;line-height:1.5;margin:7px 0;padding:6px 10px}.primary{padding:9px 18px}.tiny{margin-top:8px}.wheel{height:59vh}}

/* 伊達くんの色を鮮やかに：輪郭・黄色・エプロンをくっきり */
#dateIntro {filter:none}
#wheel {filter:none}

/* お酒に当たったときの応援ポップ。画像には透明度を掛けない */
.cheer{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);pointer-events:none;z-index:6;font-size:clamp(38px,12vw,65px);font-weight:1000;color:#ffeb35;-webkit-text-stroke:2.5px #154b90;text-shadow:3px 5px 0 #154b90;white-space:nowrap;opacity:0}
.cheer.pop{animation:cheerPop .78s ease-out both}
@keyframes cheerPop{0%{opacity:0;transform:translate(-50%,-35%) scale(.55) rotate(-7deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}55%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-100%) scale(.9)}}

.milestone{position:absolute;z-index:7;pointer-events:none;top:20%;left:4%;width:92%;text-align:center;font-size:clamp(28px,8.5vw,45px);font-weight:1000;line-height:1.25;white-space:pre-line;color:#fff000;-webkit-text-stroke:2px #194b8e;text-shadow:3px 4px 0 #194b8e;opacity:0;transform:scale(.8)}
.milestone.pop{animation:milestonePop 2s ease-in-out both}
@keyframes milestonePop{0%{opacity:0;transform:scale(.65) translateY(18px)}12%{opacity:1;transform:scale(1.13) translateY(0)}24%,76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-15px)}}
 
.game-tools{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;display:flex;align-items:center;gap:8px}
.game-tools .sound{position:static;z-index:auto}
.pause-btn{border:2px solid #2067a2;background:#fff;color:#174c85;border-radius:40px;padding:8px 12px;font-size:13px;font-weight:900;cursor:pointer}
.pause-panel{position:absolute;inset:0;z-index:8;background:rgba(8,34,68,.68);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.pause-card{width:100%;max-width:390px;max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff9ec;border:4px solid #13548d;border-radius:22px;box-shadow:7px 8px 0 #073968;text-align:center;padding:18px 15px 22px}
.pause-small{font-weight:1000;letter-spacing:.18em;color:#e63b43;font-size:11px}
.pause-card h2{font-size:30px;margin:0 0 8px;color:#0c4c90}
.pause-card p{font-size:14px;font-weight:850;margin:8px 0 16px}
.pause-rules{display:grid;gap:9px;text-align:left;font-weight:850;color:#133d67;font-size:13px;padding:12px;background:#e9f4ff;border-radius:12px;margin-bottom:18px;line-height:1.35}
.pause-card .primary{font-size:20px;min-width:190px}
.pause-note{font-size:11px;margin-top:14px;font-weight:750;color:#526d83}
@media(max-height:650px){.pause-card{padding:10px}.pause-rules{gap:5px;margin-bottom:10px}.pause-card h2{font-size:23px}.pause-card p{margin:5px 0 8px}}
</style></head><body><main class="shell" id="shell"><canvas id="game"></canvas><div class="hud" id="hud"><div class="stat"><small>生存時間</small><b id="time">0.0秒</b></div><div class="stat"><small>被弾</small><b id="hits">0 / 5杯</b></div><div class="stat"><small>最高記録</small><b id="best">0.0秒</b></div></div><div class="hint" id="hint">指で左右に動かす / PCは ← →</div><div class="game-tools"><button class="sound" id="sound" type="button">♫ ON</button><button class="pause-btn" id="pause" type="button" aria-label="一時停止して遊び方を見る">Ⅱ 一時停止</button></div>
<div class="cheer" id="cheer" aria-live="polite">応援！</div><div class="milestone" id="milestone" aria-live="polite"></div>
<section class="pause-panel hide" id="pausePanel" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div class="pause-card">
    <div class="pause-small">HOW TO PLAY</div>
    <h2 id="pauseTitle">遊び方</h2>
    <p>伊達くんを左右に動かして、お酒をよけよう！</p>
    <div class="pause-rules">
      <div>🍺🥃🥛🍋　お酒に5杯当たったら終了</div>
      <div>🧢　山田に当たると一発アウト</div>
      <div>🧴　ソルマックで1杯回復</div>
      <div>🔴　45秒ごとに巨大な赤い盃</div>
      <div>⏱　20秒ごとに落下スピードUP</div>
      <div>🏆　60秒突破、120秒で強者！</div>
    </div>
    <button class="primary" id="resume" type="button">▶ 再開する</button>
    <div class="pause-note">スマホ：指で左右に移動 ／ PC：← →</div>
  </div>
</section>
<section class="cover" id="intro"><h1>伊達を応援する！</h1><div class="sub">無事に帰ろう</div><img class="hero" id="dateIntro" alt="伊達くん"><button class="primary" id="start">ゲームスタート ▶</button></section>
<section class="over hide" id="over"><h2>お家に帰ろ〜</h2><div class="reason hide" id="reason"></div><img class="wheel" id="wheel"><div class="bottom"><p class="result" id="result">0.0 秒</p><button class="primary" id="again">もう一回！ ↻</button></div></section>
</main>

}else if(o.y>H+o.size)obstacles.splice(i,1)}}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e8e2f5');g.addColorStop(1,'#f4eff9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d8cdec';for(let i=0;i<9;i++){let x=(i*79+37)%W,y=(i*123+76)%H;ctx.beginPath();ctx.arc(x,y,Math.max(3,i*2),0,7);ctx.fill()}ctx.fillStyle='#c3bbd8';ctx.fillRect(0,H-76,W,76);ctx.strokeStyle='#877fae';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H-76);ctx.lineTo(W,H-76);ctx.stroke();for(const o of obstacles){if(o.type==='yamada'&&art.yamada.complete&&art.yamada.naturalWidth){ctx.drawImage(art.yamada,o.x-o.size*.49,o.y-o.size*.62,o.size*.98,o.size*1.30)}else if(o.type==='ozeki'&&art.ozeki.complete&&art.ozeki.naturalWidth){ctx.save();ctx.shadowColor='#0a4977';ctx.shadowBlur=12;ctx.drawImage(art.ozeki,o.x-o.size/2,o.y-o.size*.30,o.size,o.size*.60);ctx.restore()}else drawDrink(o)}ctx.fillStyle='#9690af';ctx.beginPath();ctx.ellipse(player.x,H-77,player.w*.40,7,0,0,7);ctx.fill();if(art.date.complete&&art.date.naturalWidth){ctx.save();ctx.filter='none';ctx.shadowColor='rgba(14,63,124,.48)';ctx.shadowBlur=7;ctx.drawImage(art.date,player.x-player.w/2,player.y,player.w,player.h);ctx.filter='none';ctx.restore();}else{ctx.textAlign='center';ctx.font='70px serif';ctx.fillText('🧢',player.x,player.y+80)}if(run&&hitFlash>0){ctx.fillStyle='rgba(248,54,63,'+(hitFlash/.2*.22)+')';ctx.fillRect(0,0,W,H)}}
function loop(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.045);last=now;update(dt);music();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function point(e){const r=c.getBoundingClientRect();pointerX=clamp(e.clientX-r.left,0,W)}c.addEventListener('pointerdown',e=>{if(run&&!paused){c.setPointerCapture(e.pointerId);point(e)}});c.addEventListener('pointermove',e=>{if(run&&!paused&&(e.pointerType==='touch'||e.buttons))point(e)});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(run&&!paused&&(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'))keys.left=true;if(run&&!paused&&(e.key==='ArrowRight'||e.key.toLowerCase()==='d'))keys.right=true;if(e.key===' '&&!run)startGame();else if(e.key==='Escape'&&run)setPaused(!paused)});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
